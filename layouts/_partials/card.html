<article class="card t-{{ .Section }}">
  <a href="{{ .RelPermalink }}" tabindex="-1">{{ partial "cover.html" . }}</a>
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  {{ with .Params.dek }}<p class="dek">{{ . }}</p>{{ end }}
  <p class="byline">{{ .CurrentSection.Params.singular }}{{ with .Params.authors }} · {{ delimit . ", " " & " }}{{ end }}</p>
</article>
